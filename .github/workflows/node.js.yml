# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json
    - name: Install backend dependencies
      run: npm ci --prefix backend
    - name: Install frontend dependencies
      run: npm ci --prefix frontend
    - name: Build frontend
      run: npm run build --prefix frontend
    - name: Validate backend entrypoint
      run: node --check backend/server.js

  backend-tests:
    # Full-throttle engine (2026-10-14): a merge and a deploy both require this job
    # to pass. See docs/engine/full-throttle.md.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
    - name: Install backend dependencies
      run: npm ci --prefix backend
    - name: Run the backend suite
      run: bash scripts/ci/backend-tests.sh
