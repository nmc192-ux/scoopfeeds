services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      ENABLE_SCHEDULER: "false"
      USE_BULLMQ: "true"
      REDIS_URL: redis://redis:6379
      SCOOP_PERSISTENT_DATA_DIR: /var/lib/scoop
    volumes:
      - scoop_data:/var/lib/scoop
    ports:
      - "127.0.0.1:3000:3000"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    command: ["npm", "run", "start:web"]

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      ENABLE_SCHEDULER: "false"
      USE_BULLMQ: "true"
      REDIS_URL: redis://redis:6379
      SCOOP_PERSISTENT_DATA_DIR: /var/lib/scoop
    volumes:
      - scoop_data:/var/lib/scoop
    # ─── CPU WEIGHTING ────────────────────────────────────────────────────
    # MEASURED: the scheduler was FROZEN for 18.6 minutes — 1,114,844ms with
    # 15 samples where 1130 were due, and near-zero CPU consumed across the
    # gap. It was not busy, it was not scheduled. Nothing in its code caused
    # it and no code change can fix it.
    #
    # Nothing on this stack had any CPU limit, so a worker mid-render takes
    # every core ffmpeg asks for (which is all of them — the encode passes no
    # -threads) and the scheduler waits. It needs almost no CPU; it needs to
    # be ON one, punctually, because node-cron matches an exact second.
    #
    # cpu_shares is a RELATIVE WEIGHT under contention, not a cap, so it
    # needs no knowledge of the host's core count and costs the worker
    # nothing when the scheduler is idle — which is almost always.
    cpu_shares: 4096
    stop_grace_period: 45s
    command: ["npm", "run", "start:scheduler"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      ENABLE_SCHEDULER: "false"
      USE_BULLMQ: "true"
      REDIS_URL: redis://redis:6379
      SCOOP_PERSISTENT_DATA_DIR: /var/lib/scoop
    volumes:
      - scoop_data:/var/lib/scoop
    # Lower weight than the scheduler (4096). Under contention the renderer
    # yields to the thing that has to be on time; when the scheduler is idle —
    # which is essentially always, it only enqueues — the worker still gets the
    # whole box. A cap (`cpus:`) would be the stronger lever but needs the
    # host's core count; this needs nothing and cannot over-restrict.
    cpu_shares: 512
    stop_grace_period: 60s
    command: ["npm", "run", "start:worker"]

volumes:
  scoop_data:
  redis_data:
