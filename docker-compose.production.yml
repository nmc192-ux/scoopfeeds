services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      ENABLE_SCHEDULER: "false"
      USE_BULLMQ: "true"
      REDIS_URL: redis://redis:6379
      SCOOP_PERSISTENT_DATA_DIR: /var/lib/scoop
      # Embeddings: self-hosted Ollama (service below). `environment` wins over env_file.
      EMBED_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - scoop_data:/var/lib/scoop
    ports:
      - "127.0.0.1:3000:3000"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    command: ["npm", "run", "start:web"]

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      ENABLE_SCHEDULER: "false"
      USE_BULLMQ: "true"
      REDIS_URL: redis://redis:6379
      SCOOP_PERSISTENT_DATA_DIR: /var/lib/scoop
      # Embeddings: self-hosted Ollama (service below). `environment` wins over env_file.
      EMBED_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - scoop_data:/var/lib/scoop
    # CPU weighting PARKED. cpu_shares 4096/512 was staged here to protect the
    # scheduler from the worker's renders — then `docker stats` on the 2-core
    # host read scheduler 103.14% / worker 0.12%. The scheduler is the CONSUMER,
    # not the victim, so weighting in its favour protects it from nothing.
    # Reinstate only if a reading ever shows the worker as the contender.
    stop_grace_period: 45s
    command: ["npm", "run", "start:scheduler"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      ENABLE_SCHEDULER: "false"
      USE_BULLMQ: "true"
      REDIS_URL: redis://redis:6379
      SCOOP_PERSISTENT_DATA_DIR: /var/lib/scoop
      # Embeddings: self-hosted Ollama (service below). `environment` wins over env_file.
      EMBED_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      WORKER_QUEUES: "ingestion,video,video_render,longform,social,enrichment,radio"
    volumes:
      - scoop_data:/var/lib/scoop
    stop_grace_period: 60s
    command: ["npm", "run", "start:worker"]

  # THE GRAPH WORKER. Same image, same role, a different half of the queues.
  #
  # Measured over 12 days on this 2-vCPU host: events.promote occupies 59.8% of
  # wall-clock and analysis.refresh 46.9%, against news.ingest.all at 11.7%.
  # One process is one JS thread and better-sqlite3 is synchronous, so the graph
  # jobs and the jobs with a clock were sharing a thread and the graph jobs won.
  # #136 stopped the promoter monopolising it; only this stops the two of them
  # wanting more than a thread between them.
  #
  # video_render stays with the LATENCY half deliberately, on measurement rather
  # than intuition: of 55 event-loop-starvation windows, 0 were covered by a
  # render alone, across 360 renders including 78 over ten minutes. Renders are
  # dominated by spawned ffmpeg and do not hold the loop.
  #
  # THE TWO WORKER_QUEUES LISTS MUST PARTITION THE QUEUE SET EXACTLY — every
  # queue in one container and one only. Every cycle guards itself with a
  # PROCESS-LOCAL isRunning boolean, so a queue consumed twice runs twice (two
  # social posts, two published films), and a queue consumed by neither goes
  # silently dark. backend/src/jobs/workerQueues.test.js reads THIS FILE and
  # fails on either mistake.
  worker-graph:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      ENABLE_SCHEDULER: "false"
      USE_BULLMQ: "true"
      REDIS_URL: redis://redis:6379
      SCOOP_PERSISTENT_DATA_DIR: /var/lib/scoop
      # Embeddings: self-hosted Ollama (service below). `environment` wins over env_file.
      EMBED_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      WORKER_QUEUES: "analysis,reality-index"
    volumes:
      - scoop_data:/var/lib/scoop
    stop_grace_period: 60s
    command: ["npm", "run", "start:worker"]

  # SELF-HOSTED TTS — Kokoro-82M (Apache 2.0) behind Kokoro-FastAPI, CPU build.
  #
  # Voices the automated Shorts when VIDEO_TTS_PROVIDER=kokoro (videoVoice.js).
  # Present but idle until then: the code default is still ElevenLabs. The
  # longform films never call it — they keep ElevenLabs (longform/engine/narrate.mjs).
  #
  # PINNED BY TAG AND DIGEST, never "latest": a silent image change would change
  # the voice of every Short with no commit to show for it. Digest read from
  # ghcr.io on 2026-09-26 for v0.9.0 (multi-arch index).
  #
  # NOT PUBLISHED. No `ports:` on purpose — it is reachable only from the other
  # containers on this compose network, as http://tts:8880. Nothing on the
  # internet can reach it, and it has no auth of its own.
  #
  # NO depends_on FROM THE WORKER, on purpose: a broken tts must cost Shorts,
  # never block ingestion, social or the graph from starting. The worker logs
  # whether it can reach this service once at boot ("🔊 tts: …").
  #
  # MEMORY — sized from measurements, not guessed:
  #   • VPS 2026-09-26: 7.75 GiB RAM, 2 vCPU, ~5.5 GiB available; container
  #     peaks worker 2.6 / scheduler 3.1 / web 1.7 / graph 1.2 GiB (cgroup
  #     memory.peak, which includes page cache and is not simultaneous).
  #   • Kokoro measured in the sandbox on a 24 s caption: 2.34 GiB peak RSS,
  #     1.94 GiB steady. A public CPU benchmark reports ~2.8 GB peak.
  #   3.5g is 25% over the higher of those. memswap_limit = mem_limit gives it
  #   NO swap: over the ceiling it is OOM-killed and restarted (that one video
  #   skips with "kokoro failed: …") rather than paging onto the disk the SQLite
  #   database lives on.
  #
  # cpus: 1.0 — half the box. A render keeps the other core. OMP_NUM_THREADS=1
  # matches torch's thread pool to that quota instead of two threads fighting
  # over one core's worth of CFS time. Measured at ~1x real time on one core.
  #
  # The model is baked into the image; the named volume keeps it across
  # recreates, and the entrypoint's download step no-ops when it is present.
  # ⚠️ A future image that ships NEW weights will not reach an existing volume —
  # remove `kokoro_models` when upgrading across a model change.
  tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.9.0@sha256:ee3111d6a2c903ed62f3b4fa19543c6901205ed39fce3c177e895b34a8386b9c
    restart: unless-stopped
    environment:
      OMP_NUM_THREADS: "1"
    volumes:
      - kokoro_models:/app/api/src/models
    mem_limit: 3.5g
    memswap_limit: 3.5g
    cpus: 1.0
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8880/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Model load + warmup synthesis on one core before /health answers.
      start_period: 120s

  # SELF-HOSTED EMBEDDINGS — Ollama serving nomic-embed-text (768-dim; matches the
  # vec0 FLOAT[768] table, so no schema change).
  #
  # Replaces the Gemini embedding API. The web, scheduler, worker and
  # worker-graph services point OLLAMA_BASE_URL at http://ollama:11434 above.
  #
  # LOCALHOST-ONLY. The port is bound to 127.0.0.1 for ops (curl, `ollama list`
  # from the host); nothing on the internet can reach it, and it has no auth of
  # its own. Containers use the compose network, not the published port.
  #
  # NO depends_on FROM THE APP SERVICES, on purpose (same stance as tts): a broken
  # ollama must cost embeddings — the embed handler logs "Ollama not reachable"
  # and returns null — never block ingestion, social or the graph from starting.
  #
  # MEMORY: the VPS has 7.75 GiB (measured 2026-09-26) and the container peaks
  # already add up to more than that unsimultaneously (worker 2.6 / scheduler 3.1
  # / web 1.7 / graph 1.2 GiB, plus tts capped at 3.5g). nomic-embed-text is a
  # ~275 MB model; 2g is generous for it and memswap_limit = mem_limit gives it NO
  # swap: over the ceiling it is OOM-killed and restarted rather than paging onto
  # the disk the SQLite database lives on. Watch `docker stats` after the first
  # reembed — if the box is tight, lower the tts limit before raising this one.
  #
  # cpus: 1.0 — half the box, so a backfill cannot starve a render.
  # OLLAMA_KEEP_ALIVE=24h keeps the model resident (a cold load per article batch
  # would dominate); MAX_LOADED_MODELS=1 stops it ever holding a second.
  #
  # PINNED BY TAG (0.40.2, read from Docker Hub 2026-10-09) — never "latest".
  # Add the @sha256 digest of the platform you deploy on once you have read it
  # on the host (`docker image inspect`); the tag alone is not immutable.
  ollama:
    image: ollama/ollama:0.40.2
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "2"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1.0
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ONE-SHOT MODEL PULL. Runs to completion on `docker compose up` and exits
  # (restart: "no"). `ollama pull` is idempotent: the first start downloads
  # nomic-embed-text into the ollama_models volume; every later `up` finds it
  # present and returns in a second. Not a dependency of anything — if it fails,
  # re-run it: `docker compose -f docker-compose.production.yml up ollama-pull`.
  ollama-pull:
    image: ollama/ollama:0.40.2
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull nomic-embed-text"]
    mem_limit: 256m

volumes:
  scoop_data:
  redis_data:
  kokoro_models:
  ollama_models:
